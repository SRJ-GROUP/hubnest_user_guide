<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 430" width="100%" height="auto" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="paletteShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="activeItemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Background overlay backdrop -->
  <rect x="0" y="0" width="680" height="430" rx="12" fill="#0B0F17" fill-opacity="0.7"/>

  <!-- Command Palette Window Box (560px x 370px, centered) -->
  <rect x="60" y="25" width="560" height="380" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#paletteShadow)"/>

  <!-- Search Input Header -->
  <!-- Search Icon -->
  <circle cx="95" cy="62" r="7" fill="none" stroke="#10B981" stroke-width="2"/>
  <line x1="100" y1="67" x2="107" y2="74" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>

  <!-- Input Text Prompt & User Query -->
  <text x="122" y="66" fill="#F8FAFC" font-size="14.5" font-weight="500">crm</text>
  <rect x="150" y="52" width="2" height="18" fill="#10B981"/> <!-- Blinking cursor -->

  <!-- Shortcut Badge in search bar -->
  <rect x="525" y="50" width="75" height="24" rx="6" fill="#0F172A" stroke="#334155"/>
  <text x="536" y="66" fill="#94A3B8" font-size="11" font-weight="600">Ctrl + K</text>

  <!-- Divider Line -->
  <line x1="60" y1="90" x2="620" y2="90" stroke="#334155" stroke-width="1"/>

  <!-- Section Label -->
  <text x="80" y="114" fill="#64748B" font-size="10.5" font-weight="700" letter-spacing="1">SUGGESTED HUBS</text>

  <!-- Item 1: Hub CRM (ACTIVE SELECTED) -->
  <rect x="74" y="126" width="532" height="48" rx="8" fill="url(#activeItemGrad)" stroke="#10B981" stroke-width="1.2"/>
  <!-- CRM Icon -->
  <rect x="88" y="136" width="28" height="28" rx="6" fill="#0284C7" fill-opacity="0.2"/>
  <circle cx="102" cy="150" r="6" fill="#0284C7"/>
  <!-- Title & Description -->
  <text x="128" y="148" fill="#FFFFFF" font-size="13" font-weight="700">Hub CRM</text>
  <text x="128" y="164" fill="#94A3B8" font-size="11">Deal pipelines, lead capturing, sales tracking &amp; revenue goals</text>
  <!-- Enter to Open Action Badge -->
  <rect x="538" y="138" width="56" height="24" rx="5" fill="#10B981"/>
  <text x="548" y="154" fill="#FFFFFF" font-size="10.5" font-weight="700">↵ Open</text>

  <!-- Item 2: Hub HRMS -->
  <rect x="74" y="180" width="532" height="46" rx="8" fill="transparent"/>
  <rect x="88" y="189" width="28" height="28" rx="6" fill="#9C27B0" fill-opacity="0.2"/>
  <circle cx="102" cy="203" r="6" fill="#9C27B0"/>
  <text x="128" y="202" fill="#E2E8F0" font-size="13" font-weight="600">Hub HRMS</text>
  <text x="128" y="217" fill="#64748B" font-size="11">Recruiters internal registry and employee task tracking</text>
  <text x="578" y="208" fill="#64748B" font-size="13">›</text>

  <!-- Item 3: Hub Recruiter -->
  <rect x="74" y="232" width="532" height="46" rx="8" fill="transparent"/>
  <rect x="88" y="241" width="28" height="28" rx="6" fill="#6762FD" fill-opacity="0.2"/>
  <circle cx="102" cy="255" r="6" fill="#6762FD"/>
  <text x="128" y="254" fill="#E2E8F0" font-size="13" font-weight="600">Hub Recruiter</text>
  <text x="128" y="269" fill="#64748B" font-size="11">AI candidate hiring, job posting &amp; screening workspace</text>
  <text x="578" y="260" fill="#64748B" font-size="13">›</text>

  <!-- Item 4: Hub Meet -->
  <rect x="74" y="284" width="532" height="46" rx="8" fill="transparent"/>
  <rect x="88" y="293" width="28" height="28" rx="6" fill="#3F51B5" fill-opacity="0.2"/>
  <circle cx="102" cy="307" r="6" fill="#3F51B5"/>
  <text x="128" y="306" fill="#E2E8F0" font-size="13" font-weight="600">Hub Meet</text>
  <text x="128" y="321" fill="#64748B" font-size="11">Secure video screening meetings &amp; virtual classrooms</text>
  <text x="578" y="312" fill="#64748B" font-size="13">›</text>

  <!-- Bottom Helper Bar -->
  <line x1="60" y1="358" x2="620" y2="358" stroke="#334155" stroke-width="1"/>
  <rect x="60" y="358" width="560" height="47" rx="0" fill="#0F172A" style="border-bottom-left-radius: 14px; border-bottom-right-radius: 14px;"/>

  <!-- Nav keys indicators -->
  <text x="84" y="386" fill="#94A3B8" font-size="11">
    <tspan fill="#F1F5F9" font-weight="700">↑↓</tspan> Navigate    
    <tspan dx="15" fill="#F1F5F9" font-weight="700">↵</tspan> Launch Hub    
    <tspan dx="15" fill="#F1F5F9" font-weight="700">esc</tspan> Close
  </text>

  <rect x="515" y="371" width="85" height="22" rx="5" fill="#10B981" fill-opacity="0.15"/>
  <text x="525" y="386" fill="#34D399" font-size="10.5" font-weight="700">7 Hubs Ready</text>
</svg>
