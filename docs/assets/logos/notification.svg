<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="notif_grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8DB699"/>
      <stop offset="1" stop-color="#6E9C7B"/>
    </linearGradient>
  </defs>

  <!-- Bell Shape Outline -->
  <path d="M 70 25 C 80 25 90 35 90 50 C 110 55 110 95 110 120 L 25 120 C 25 95 25 55 50 50 C 50 35 60 25 70 25 Z" stroke="url(#notif_grad)" stroke-width="16" stroke-linejoin="round" fill="none"/>
  
  <!-- Bell Clapper bottom -->
  <path d="M 55 130 C 55 142 85 142 85 130" stroke="url(#notif_grad)" stroke-width="12" stroke-linecap="round" fill="none"/>

  <!-- Network Hub Center Circle -->
  <circle cx="100" cy="100" r="22" fill="white" stroke="url(#notif_grad)" stroke-width="14"/>

  <!-- Network Spokes & External Nodes -->
  <!-- Spoke 1 Right -->
  <line x1="122" y1="100" x2="160" y2="100" stroke="url(#notif_grad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="170" cy="100" r="12" fill="white" stroke="url(#notif_grad)" stroke-width="8"/>

  <!-- Spoke 2 Down-Right -->
  <line x1="116" y1="116" x2="148" y2="148" stroke="url(#notif_grad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="156" cy="156" r="12" fill="white" stroke="url(#notif_grad)" stroke-width="8"/>

  <!-- Spoke 3 Down -->
  <line x1="100" y1="122" x2="100" y2="162" stroke="url(#notif_grad)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="100" cy="172" r="12" fill="white" stroke="url(#notif_grad)" stroke-width="8"/>

  <!-- Broadcast Signal Arcs Top Right -->
  <path d="M 120 25 A 50 50 0 0 1 180 85" stroke="url(#notif_grad)" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M 120 45 A 30 30 0 0 1 160 85" stroke="url(#notif_grad)" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
