<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="teal_grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6797A6"/>
      <stop offset="1" stop-color="#467382"/>
    </linearGradient>
  </defs>

  <!-- Top-Left Square Frame -->
  <rect x="25" y="25" width="105" height="105" rx="4" stroke="url(#teal_grad)" stroke-width="16" fill="none"/>

  <!-- Bottom-Right Overlapping Square Frame with Cutout Notch Effect -->
  <rect x="75" y="75" width="105" height="105" rx="4" stroke="url(#teal_grad)" stroke-width="16" fill="none"/>
  
  <!-- White Gap Masks for Interlocking 3D Effect -->
  <rect x="73" y="20" width="10" height="35" fill="white"/>
  <rect x="125" y="73" width="35" height="10" fill="white"/>
</svg>
