site_name: HubNest User Guide
site_description: Official End-User and Administrator Guide for HubNest Workspace, HubMeet, HubCRM, HubHRMS, and VoIP Calling.
site_author: SRJ HubNest Enterprise
site_url: https://docs.srjhubnest.com

theme:
  name: material
  custom_dir: overrides
  logo: assets/logos/hubnest_icon.png
  favicon: assets/logos/hubnest_icon.png
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

extra_css:
  - assets/stylesheets/diagram-zoom.css
  - assets/stylesheets/nav-tabs-scroll.css

extra_javascript:
  - assets/javascripts/diagram-zoom.js
  - assets/javascripts/nav-tabs-scroll.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

